name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Set lowercase image name
        id: image-name
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        run: |
          $image = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())"
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "image=$image`n", $utf8)
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-name.outputs.image }}:latest
            ${{ steps.image-name.outputs.image }}:${{ github.sha }}
      - name: Update GitOps repository
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        env:
          GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
          IMAGE_NAME: ${{ steps.image-name.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path gitops) {
            Remove-Item -Recurse -Force gitops
          }
          git clone https://github.com/fonsahpageo/grade-api-gitops.git gitops
          if ($LASTEXITCODE -ne 0) { throw 'git clone failed' }
          Push-Location gitops
          try {
            $deployment = [System.IO.File]::ReadAllText("$PWD\deployment.yaml")
            $image = "image: ${env:IMAGE_NAME}:${env:IMAGE_TAG}"
            $deployment = $deployment -replace 'image: ghcr.io/.*:.*', $image
            [System.IO.File]::WriteAllText("$PWD\deployment.yaml", $deployment)

            git config user.name "GitHub Actions"
            if ($LASTEXITCODE -ne 0) { throw 'git config user.name failed' }
            git config user.email "actions@github.com"
            if ($LASTEXITCODE -ne 0) { throw 'git config user.email failed' }
            git add deployment.yaml
            if ($LASTEXITCODE -ne 0) { throw 'git add failed' }
            git commit -m "Update image to $env:IMAGE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
            git push -f "https://x-access-token:$($env:GIT_TOKEN)@github.com/fonsahpageo/grade-api-gitops.git" main
            if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
          }
          finally {
            Pop-Location
          }
